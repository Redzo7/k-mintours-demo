[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-cover"
version = "0.1.0"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
include = ["drone_cover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
